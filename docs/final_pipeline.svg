<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5797"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8860b"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker>
  </defs>
  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#1f3a68">QueryGenie — pipeline as evaluated</text>
  <g font-size="17" fill="#444">
    <rect x="40" y="76" width="18" height="18" rx="3" fill="#e8eef7" stroke="#2b5797" stroke-width="2"/><text x="66" y="91">Reproduced from CodeS (SIGMOD 2024)</text>
    <rect x="400" y="76" width="18" height="18" rx="3" fill="#fdf2d6" stroke="#b8860b" stroke-width="2"/><text x="426" y="91">Our enhancement: confidence-aware abstention</text>
    <rect x="820" y="76" width="18" height="18" rx="3" fill="#e2f1e8" stroke="#2e7d4f" stroke-width="2"/><text x="846" y="91">Application</text>
  </g>

  <!-- Row 1: reproduced CodeS pipeline -->
  <g font-size="16" fill="#333" text-anchor="middle">
    <rect x="40" y="130" width="240" height="150" rx="12" fill="#ffffff" stroke="#2b5797" stroke-width="2.5"/>
    <text x="160" y="172" font-size="20" font-weight="700" fill="#1f3a68">Question</text>
    <text x="160" y="205">“Which students failed</text><text x="160" y="227">more than two subjects?”</text>

    <rect x="360" y="130" width="240" height="150" rx="12" fill="#e8eef7" stroke="#2b5797" stroke-width="2.5"/>
    <text x="480" y="172" font-size="20" font-weight="700" fill="#1f3a68">Database prompt</text>
    <text x="480" y="203">schema: types, keys,</text><text x="480" y="225">sample values +</text><text x="480" y="247">matched cell values</text>

    <rect x="680" y="130" width="240" height="150" rx="12" fill="#e8eef7" stroke="#2b5797" stroke-width="2.5"/>
    <text x="800" y="172" font-size="20" font-weight="700" fill="#1f3a68">CodeS-1B (SFT)</text>
    <text x="800" y="205">beam search,</text><text x="800" y="227">4 beams returned</text>

    <rect x="1000" y="130" width="240" height="150" rx="12" fill="#e8eef7" stroke="#2b5797" stroke-width="2.5"/>
    <text x="1120" y="172" font-size="20" font-weight="700" fill="#1f3a68">4 candidate SQLs</text>
    <text x="1120" y="205">each with a</text><text x="1120" y="227">beam score</text>

    <rect x="1320" y="130" width="240" height="150" rx="12" fill="#e8eef7" stroke="#2b5797" stroke-width="2.5"/>
    <text x="1440" y="172" font-size="20" font-weight="700" fill="#1f3a68">Execute + select</text>
    <text x="1440" y="203">run all 4 on the DB;</text><text x="1440" y="225">keep the first that runs</text><text x="1440" y="247">(authors’ rule)</text>
  </g>
  <g stroke="#2b5797" stroke-width="2.5" fill="none" marker-end="url(#ab)">
    <path d="M280,205 H356"/><path d="M600,205 H676"/><path d="M920,205 H996"/><path d="M1240,205 H1316"/>
  </g>

  <!-- Row 2: enhancement -->
  <g font-size="16" fill="#333" text-anchor="middle">
    <rect x="1320" y="380" width="240" height="150" rx="12" fill="#fdf2d6" stroke="#b8860b" stroke-width="2.5"/>
    <text x="1440" y="422" font-size="20" font-weight="700" fill="#1f3a68">Execution agreement</text>
    <text x="1440" y="455">how many of the 4</text><text x="1440" y="477">return the same result</text><text x="1440" y="499">(0–4 of 4)</text>

    <rect x="1000" y="380" width="240" height="150" rx="12" fill="#fdf2d6" stroke="#b8860b" stroke-width="2.5"/>
    <text x="1120" y="422" font-size="20" font-weight="700" fill="#1f3a68">Confident enough?</text>
    <text x="1120" y="455">agreement (+ beam</text><text x="1120" y="477">probability) vs a threshold</text><text x="1120" y="499">set by strictness mode</text>

    <rect x="680" y="380" width="240" height="150" rx="12" fill="#e2f1e8" stroke="#2e7d4f" stroke-width="2.5"/>
    <text x="800" y="422" font-size="20" font-weight="700" fill="#1f3a68">Answer</text>
    <text x="800" y="455">table + auto chart +</text><text x="800" y="477">confidence badge +</text><text x="800" y="499">the SQL behind it</text>

    <rect x="1000" y="630" width="240" height="150" rx="12" fill="#fdf2d6" stroke="#b8860b" stroke-width="2.5"/>
    <text x="1120" y="672" font-size="20" font-weight="700" fill="#1f3a68">“Did you mean…?”</text>
    <text x="1120" y="705">no table; show the</text><text x="1120" y="727">distinct interpretations</text><text x="1120" y="749">for the user to pick</text>
  </g>
  <g stroke="#b8860b" stroke-width="2.5" fill="none">
    <path d="M1440,280 V376" marker-end="url(#aa)"/>
    <path d="M1320,455 H1244" marker-end="url(#aa)"/>
    <path d="M1120,530 V626" marker-end="url(#aa)"/>
  </g>
  <path d="M1000,455 H924" stroke="#2e7d4f" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <path d="M1000,705 H800 V534" stroke="#2e7d4f" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#ag)"/>
  <g font-size="16" font-style="italic">
    <text x="962" y="445" fill="#2e7d4f" text-anchor="middle">yes</text>
    <text x="1134" y="585" fill="#b8860b">no → abstain</text>
    <text x="900" y="695" fill="#2e7d4f" text-anchor="middle">user picks one</text>
  </g>

  <!-- measured result -->
  <g font-size="16" fill="#333">
    <rect x="40" y="630" width="620" height="170" rx="12" fill="#f7f7f5" stroke="#c3c2b7" stroke-width="1.5"/>
    <text x="62" y="664" font-size="18" font-weight="700" fill="#1f3a68">Measured on Spider dev (1,034 questions)</text>
    <text x="62" y="696">Answer everything (reproduction): 77.8% correct</text>
    <text x="62" y="720" fill="#666">(the paper reports 77.9%)</text>
    <text x="62" y="750">With abstention: 90.4% answered, 83.3% correct</text>
    <text x="62" y="778">Wrong answers 230 → 156 (−32%); p = 7.7 × 10⁻¹⁰</text>
  </g>
</svg>
